name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            version="v0.0.0-pr.${{ github.event.pull_request.number }}.${GITHUB_SHA::7}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            version="${{ github.ref_name }}"
          else
            version="v0.1.${{ github.run_number }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Versi: $version"

      - name: Vet & test
        run: |
          go vet ./...
          go test ./...

      - name: Build
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            bin="totp"
            [ "$os" = "windows" ] && bin="totp.exe"

            echo ">> build $os/$arch"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/$bin" ./cmd/totp

            if [ "$os" = "windows" ]; then
              (cd dist && zip -q "totp-$os-$arch.zip" "$bin")
            else
              (cd dist && tar -czf "totp-$os-$arch.tar.gz" "$bin")
            fi
            rm "dist/$bin"
          done

          (cd dist && sha256sum totp-*.tar.gz totp-*.zip > checksums.txt)
          ls -lh dist

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: totp-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*
            install.sh
            install.ps1
